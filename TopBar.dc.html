<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:56px;background:#34050D;display:flex;align-items:center;gap:16px;padding:0 20px 0 0;color:#fff;font-family:'IBM Plex Sans',system-ui,sans-serif;border-bottom:1px solid rgba(255,255,255,.06)">
  <a href="Home.dc.html" style="width:232px;flex:none;display:flex;align-items:center;gap:10px;padding-left:20px;box-sizing:border-box;color:#fff;text-decoration:none">
    <span style="font:26px/1 'Material Symbols Outlined';color:#fff">settings</span>
    <span style="font-weight:700;font-size:18px;letter-spacing:.02em">CMMS</span><span style="font-weight:400;font-size:11px;letter-spacing:.14em;opacity:.7;margin-left:-4px;margin-top:4px">WEB</span>
  </a>
  <label style="flex:1;max-width:520px;height:36px;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:text">
    <span style="font:20px/1 'Material Symbols Outlined';opacity:.7">search</span>
    <input placeholder="Search equipment, parts, work orders…" style="flex:1;min-width:0;background:transparent;border:0;outline:none;color:#fff;font:13px 'IBM Plex Sans',sans-serif" />
    <span style="font:11px 'IBM Plex Mono',monospace;padding:2px 6px;border:1px solid rgba(255,255,255,.2);border-radius:4px;opacity:.6">/</span>
  </label>
  <div style="flex:1"></div>
  <button style="height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;background:transparent;border:0;border-radius:6px;color:#fff;font:500 13px 'IBM Plex Sans',sans-serif;cursor:pointer" style-hover="background:rgba(255,255,255,.08)">
    <span style="font:20px/1 'Material Symbols Outlined';opacity:.8">factory</span>Thourotte Plant<span style="font:18px/1 'Material Symbols Outlined';opacity:.6">expand_more</span>
  </button>
  <div style="width:1px;height:24px;background:rgba(255,255,255,.12)"></div>
  <div style="display:flex;gap:4px">
    <button title="Notifications" style="position:relative;width:36px;height:36px;display:grid;place-items:center;background:transparent;border:0;border-radius:6px;color:#fff;cursor:pointer" style-hover="background:rgba(255,255,255,.08)">
      <span style="font:22px/1 'Material Symbols Outlined'">notifications</span>
      <span style="position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#C00018;border:2px solid #34050D;font:600 9px/12px 'IBM Plex Sans',sans-serif;color:#fff;text-align:center">12</span>
    </button>
    <button title="Help &amp; support" style="width:36px;height:36px;display:grid;place-items:center;background:transparent;border:0;border-radius:6px;color:#fff;cursor:pointer" style-hover="background:rgba(255,255,255,.08)">
      <span style="font:22px/1 'Material Symbols Outlined'">help</span>
    </button>
  </div>
  <button style="height:40px;display:flex;align-items:center;gap:10px;padding:0 8px 0 4px;background:transparent;border:0;border-radius:8px;color:#fff;cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,.08)">
    <span style="width:30px;height:30px;border-radius:50%;background:#7A1E2C;display:grid;place-items:center;font:600 12px 'IBM Plex Sans',sans-serif">GD</span>
    <span style="display:flex;flex-direction:column;gap:1px">
      <span style="font:600 13px/1.2 'IBM Plex Sans',sans-serif">Gaudéric Durand</span>
      <span style="font:400 11px/1.2 'IBM Plex Sans',sans-serif;opacity:.65">{{ role }}</span>
    </span>
    <span style="font:18px/1 'Material Symbols Outlined';opacity:.6">expand_more</span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:56},&quot;role&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Maintenance Manager&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { role: this.props.role ?? 'Maintenance Manager' }; }
}
</script>
</body>
</html>
