<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="width:{{ width }};height:100%;box-sizing:border-box;background:#34050D;padding:12px 12px 12px;display:flex;flex-direction:column;gap:2px;font-family:'IBM Plex Sans',system-ui,sans-serif;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;transition:width .18s ease">
  <sc-for list="{{ primary }}" as="it" hint-placeholder-count="7">
    <a href="{{ it.href }}" title="{{ it.tip }}" style="position:relative;flex:none;height:38px;display:flex;align-items:center;gap:12px;padding:0 {{ it.pad }};justify-content:{{ it.justify }};border-radius:6px;background:{{ it.bg }};color:{{ it.color }};text-decoration:none;font-size:13.5px;font-weight:{{ it.weight }};white-space:nowrap" style-hover="background:rgba(255,255,255,.08);color:#fff">
      <span style="position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:{{ it.bar }}"></span>
      <span style="font:20px/1 'Material Symbols Outlined';flex:none">{{ it.icon }}</span>
      <sc-if value="{{ it.showLabel }}" hint-placeholder-val="{{ true }}"><span style="flex:1;overflow:hidden;text-overflow:ellipsis">{{ it.label }}</span></sc-if>
      <sc-if value="{{ it.chevron }}"><span style="font:18px/1 'Material Symbols Outlined';opacity:.6">expand_more</span></sc-if>
    </a>
    <sc-if value="{{ it.showChildren }}">
      <div style="flex:none;display:flex;flex-direction:column;gap:1px;margin:0 0 4px 21px;padding-left:12px;border-left:1px solid rgba(255,255,255,.12)">
        <sc-for list="{{ it.children }}" as="c">
          <a href="{{ c.href }}" style="height:32px;display:flex;align-items:center;padding:0 10px;border-radius:6px;background:{{ c.bg }};color:{{ c.color }};text-decoration:none;font-size:13px;font-weight:{{ c.weight }};white-space:nowrap" style-hover="background:rgba(255,255,255,.08);color:#fff">{{ c.label }}</a>
        </sc-for>
      </div>
    </sc-if>
  </sc-for>
  <div style="flex:1;min-height:16px"></div>
  <div style="flex:none;height:1px;background:rgba(255,255,255,.1);margin:0 4px 8px"></div>
  <sc-for list="{{ secondary }}" as="it" hint-placeholder-count="2">
    <a href="{{ it.href }}" title="{{ it.tip }}" style="position:relative;flex:none;height:38px;display:flex;align-items:center;gap:12px;padding:0 {{ it.pad }};justify-content:{{ it.justify }};border-radius:6px;background:{{ it.bg }};color:{{ it.color }};text-decoration:none;font-size:13.5px;font-weight:{{ it.weight }};white-space:nowrap" style-hover="background:rgba(255,255,255,.08);color:#fff">
      <span style="position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:{{ it.bar }}"></span>
      <span style="font:20px/1 'Material Symbols Outlined';flex:none">{{ it.icon }}</span>
      <sc-if value="{{ it.showLabel }}" hint-placeholder-val="{{ true }}"><span style="flex:1;overflow:hidden;text-overflow:ellipsis">{{ it.label }}</span></sc-if>
    </a>
  </sc-for>
  <button onClick="{{ toggle }}" title="{{ toggleTip }}" style="flex:none;margin-top:6px;height:36px;display:flex;align-items:center;gap:12px;padding:0 {{ togglePad }};justify-content:{{ toggleJustify }};background:transparent;border:0;border-radius:6px;color:rgba(255,255,255,.55);font:500 12.5px 'IBM Plex Sans',sans-serif;cursor:pointer;white-space:nowrap" style-hover="background:rgba(255,255,255,.08);color:#fff">
    <span style="font:20px/1 'Material Symbols Outlined'">{{ toggleIcon }}</span>
    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span>Collapse menu</span></sc-if>
  </button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:844},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;assets&quot;,&quot;workorders&quot;,&quot;plans&quot;,&quot;checklists&quot;,&quot;planning&quot;,&quot;parts&quot;,&quot;documents&quot;,&quot;teams&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const KEY = 'cmms.nav.collapsed';
class Component extends DCLogic {
  state = { collapsed: (() => { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } })() };
  componentDidMount() {
    this._on = e => this.setState({ collapsed: !!e.detail });
    window.addEventListener('cmms-nav', this._on);
  }
  componentWillUnmount() { window.removeEventListener('cmms-nav', this._on); }
  toggle() {
    const c = !this.state.collapsed;
    try { localStorage.setItem(KEY, c ? '1' : '0'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('cmms-nav', { detail: c }));
  }
  renderVals() {
    const a = this.props.active ?? 'home', col = this.state.collapsed;
    const mk = (key, label, icon, href, children) => {
      const kids = (children || []).map(([k, l, h]) => ({ label: l, href: h, bg: k === a ? 'rgba(255,255,255,.1)' : 'transparent', color: k === a ? '#fff' : 'rgba(255,255,255,.66)', weight: k === a ? 600 : 400 }));
      const act = key === a, childAct = (children || []).some(c => c[0] === a), on = act || (col && childAct);
      return { label, icon, href, tip: col ? label : '', showLabel: !col, chevron: !col && kids.length > 0, showChildren: !col && kids.length > 0, children: kids,
        pad: col ? '0' : '12px', justify: col ? 'center' : 'flex-start', bg: on ? 'rgba(255,255,255,.1)' : 'transparent', color: on || childAct ? '#fff' : 'rgba(255,255,255,.74)', weight: on ? 600 : 500, bar: on ? '#E0243A' : 'transparent' };
    };
    return {
      width: col ? '64px' : '232px', expanded: !col,
      toggle: () => this.toggle(), toggleIcon: col ? 'left_panel_open' : 'left_panel_close', toggleTip: col ? 'Expand menu' : 'Collapse menu', togglePad: col ? '0' : '12px', toggleJustify: col ? 'center' : 'flex-start',
      primary: [
        mk('home', 'Home', 'home', 'Home.dc.html'),
        mk('assets', 'Assets', 'precision_manufacturing', 'Assets.dc.html'),
        mk('workorders', 'Work orders', 'build', 'Work Orders.dc.html'),
        mk('preventive', 'Preventive', 'event_repeat', 'Maintenance Plans.dc.html', [['plans', 'Maintenance plans', 'Maintenance Plans.dc.html'], ['checklists', 'Checklists', 'Checklists.dc.html']]),
        mk('planning', 'Planning', 'calendar_month', 'Planning.dc.html'),
        mk('parts', 'Spare parts', 'inventory_2', 'Spare Parts.dc.html'),
        mk('documents', 'Documents', 'description', 'Documents.dc.html'),
      ],
      secondary: [mk('teams', 'Teams & users', 'group', 'Teams and Users.dc.html'), mk('admin', 'Administration', 'settings', 'Administration.dc.html')],
    };
  }
}
</script>
</body>
</html>
