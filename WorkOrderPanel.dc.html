<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&amp;display=block" />
</helmet>
  <sc-if value="{{ drawerOpen }}">
    <div onClick="{{ closeDrawer }}" style="position:fixed;inset:56px 0 0 0;background:rgba(16,24,40,.28);z-index:50"></div>
    <aside style="position:fixed;top:56px;right:0;bottom:0;width:560px;z-index:51;background:#fff;box-shadow:-12px 0 32px rgba(16,24,40,.14);display:flex;flex-direction:column;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;color:#1E2430">
      <div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #EEF0F3">
        <div style="flex:1"><h2 style="margin:0;font-size:16px;font-weight:600">New work order</h2><p style="margin:2px 0 0;font-size:12.5px;color:#667085">{{ drawerSub }}</p></div>
        <button onClick="{{ closeDrawer }}" style="width:32px;height:32px;display:grid;place-items:center;background:transparent;border:0;border-radius:6px;color:#475467;cursor:pointer" style-hover="background:#F2F4F7"><span style="font:20px/1 'Material Symbols Outlined'">close</span></button>
      </div>
      <div style="flex:1;overflow:auto;padding:0 20px 20px">
        <div style="display:flex;align-items:center;gap:8px;padding:18px 0 10px"><span style="width:20px;height:20px;border-radius:50%;background:#1E2430;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600">1</span><span style="font-weight:600;font-size:14px">General information</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Asset<span style="color:#C00018"> *</span></span>
            <span style="position:relative;display:flex">
              <select value="{{ f.asset }}" onChange="{{ on.asset }}" style="appearance:none;-webkit-appearance:none;width:100%;height:36px;padding:0 30px 0 10px;border:1px solid {{ err.asset }};border-radius:6px;font:13px 'IBM Plex Sans',sans-serif;color:#1E2430;background:#fff;outline:none">
                <option value="">Select an asset</option>
                <sc-for list="{{ assetOpts }}" as="o"><option value="{{ o.code }}">{{ o.label }}</option></sc-for>
              </select>
              <span style="position:absolute;right:8px;top:9px;pointer-events:none;font:18px/1 'Material Symbols Outlined';color:#98A2B3">expand_more</span>
            </span>
            <sc-if value="{{ prefilled }}"><span style="font-size:12px;color:#667085;display:flex;align-items:center;gap:4px"><span style="font:14px/1 'Material Symbols Outlined'">link</span>Prefilled from the asset record</span></sc-if>
          </label>
          <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Work order type<span style="color:#C00018"> *</span></span>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
              <sc-for list="{{ types }}" as="t" hint-placeholder-count="4">
                <button onClick="{{ t.select }}" style="height:36px;display:flex;align-items:center;justify-content:center;gap:6px;background:{{ t.bg }};border:1px solid {{ t.border }};border-radius:6px;font:{{ t.font }};color:{{ t.color }};cursor:pointer"><span style="font:17px/1 'Material Symbols Outlined'">{{ t.icon }}</span>{{ t.label }}</button>
              </sc-for>
            </div>
          </div>
          <label style="display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Priority<span style="color:#C00018"> *</span></span>
            <span style="position:relative;display:flex;align-items:center">
              <span style="position:absolute;left:10px;width:8px;height:8px;border-radius:2px;background:{{ prioDot }}"></span>
              <select value="{{ f.prio }}" onChange="{{ on.prio }}" style="appearance:none;-webkit-appearance:none;width:100%;height:36px;padding:0 30px 0 26px;border:1px solid {{ err.prio }};border-radius:6px;font:13px 'IBM Plex Sans',sans-serif;color:#1E2430;background:#fff;outline:none">
                <option value="">Select</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
              </select>
              <span style="position:absolute;right:8px;pointer-events:none;font:18px/1 'Material Symbols Outlined';color:#98A2B3">expand_more</span>
            </span>
          </label>
          <label style="display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Assigned to<span style="color:#C00018"> *</span></span>
            <span style="position:relative;display:flex">
              <select value="{{ f.who }}" onChange="{{ on.who }}" style="appearance:none;-webkit-appearance:none;width:100%;height:36px;padding:0 30px 0 10px;border:1px solid {{ err.who }};border-radius:6px;font:13px 'IBM Plex Sans',sans-serif;color:#1E2430;background:#fff;outline:none">
                <option value="">Technician or team</option>
                <optgroup label="Technicians"><option>Pierre Leroy</option><option>Sophie Martin</option><option>Marc Dupont</option><option>Julie Martin</option><option>Sofia Benali</option></optgroup>
                <optgroup label="Teams"><option>Mechanical team</option><option>Electrical team</option><option>Float Line team</option></optgroup>
              </select>
              <span style="position:absolute;right:8px;top:9px;pointer-events:none;font:18px/1 'Material Symbols Outlined';color:#98A2B3">expand_more</span>
            </span>
          </label>
          <label style="display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Request date<span style="color:#C00018"> *</span></span>
            <input type="date" value="{{ f.req }}" onInput="{{ on.req }}" style="height:36px;padding:0 10px;border:1px solid {{ err.req }};border-radius:6px;font:13px 'IBM Plex Sans',sans-serif;color:#1E2430;outline:none" />
          </label>
          <label style="display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Desired date &amp; time</span>
            <input type="datetime-local" value="{{ f.due }}" onInput="{{ on.due }}" style="height:36px;padding:0 10px;border:1px solid {{ err.due }};border-radius:6px;font:13px 'IBM Plex Sans',sans-serif;color:#1E2430;outline:none" />
            <sc-if value="{{ dateErr }}"><span style="font-size:12px;color:#B42318">Can't be before the request date</span></sc-if>
          </label>
        </div>

        <div style="display:flex;align-items:center;gap:8px;padding:24px 0 10px"><span style="width:20px;height:20px;border-radius:50%;background:#1E2430;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600">2</span><span style="font-weight:600;font-size:14px">Details</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Title<span style="color:#C00018"> *</span></span>
            <input value="{{ f.title }}" onInput="{{ on.title }}" placeholder="e.g. Replace conveyor bearing" style="height:36px;padding:0 10px;border:1px solid {{ err.title }};border-radius:6px;font:13px 'IBM Plex Sans',sans-serif;color:#1E2430;outline:none" style-focus="border-color:#C00018" />
          </label>
          <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:5px">
            <span style="display:flex;font-size:12.5px;font-weight:500;color:#344054">Description<span style="color:#C00018">&nbsp;*</span><span style="margin-left:auto;font-weight:400;color:#98A2B3">{{ descCount }} / 500</span></span>
            <textarea value="{{ f.desc }}" onInput="{{ on.desc }}" maxlength="500" rows="4" placeholder="Context, symptoms, actions to carry out…" style="padding:8px 10px;border:1px solid {{ err.desc }};border-radius:6px;font:13px/1.5 'IBM Plex Sans',sans-serif;color:#1E2430;outline:none;resize:vertical"></textarea>
          </label>
          <label style="display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Failure category</span>
            <span style="position:relative;display:flex">
              <select value="{{ f.cat }}" onChange="{{ on.cat }}" style="appearance:none;-webkit-appearance:none;width:100%;height:36px;padding:0 30px 0 10px;border:1px solid #D0D5DD;border-radius:6px;font:13px 'IBM Plex Sans',sans-serif;color:#1E2430;background:#fff;outline:none">
                <option value="">Select a category</option><option>Mechanical</option><option>Electrical</option><option>Hydraulic</option><option>Pneumatic</option><option>Instrumentation</option><option>Software / PLC</option>
              </select>
              <span style="position:absolute;right:8px;top:9px;pointer-events:none;font:18px/1 'Material Symbols Outlined';color:#98A2B3">expand_more</span>
            </span>
          </label>
          <div style="display:flex;flex-direction:column;gap:5px">
            <span style="font-size:12.5px;font-weight:500;color:#344054">Production stop</span>
            <button onClick="{{ toggleStop }}" style="height:36px;display:flex;align-items:center;gap:10px;padding:0;background:transparent;border:0;cursor:pointer;font:500 13px 'IBM Plex Sans',sans-serif;color:#1E2430">
              <span style="position:relative;width:36px;height:20px;border-radius:10px;background:{{ stopTrack }};transition:background .15s"><span style="position:absolute;top:2px;left:{{ stopKnob }};width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s"></span></span>{{ stopLabel }}
            </button>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;padding:24px 0 10px"><span style="width:20px;height:20px;border-radius:50%;background:#1E2430;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600">3</span><span style="font-weight:600;font-size:14px">Parts &amp; documents</span></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;align-items:center"><span style="font-size:12.5px;font-weight:500;color:#344054">Required parts</span></div>
          <sc-for list="{{ parts }}" as="p">
            <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #E4E7EC;border-radius:6px">
              <span style="font:18px/1 'Material Symbols Outlined';color:#98A2B3">inventory_2</span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-weight:500">{{ p.name }}</span><span style="font-size:12px;color:#667085"><span style="font-family:'IBM Plex Mono',monospace">{{ p.ref }}</span> · <span style="color:{{ p.stockColor }};font-weight:500">{{ p.stockLabel }}</span></span></span>
              <span style="display:flex;align-items:center;border:1px solid #D0D5DD;border-radius:6px;height:28px">
                <button onClick="{{ p.dec }}" style="width:26px;height:26px;background:transparent;border:0;color:#475467;cursor:pointer;font:16px/1 'Material Symbols Outlined'">remove</button>
                <span style="width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums">{{ p.qty }}</span>
                <button onClick="{{ p.inc }}" style="width:26px;height:26px;background:transparent;border:0;color:#475467;cursor:pointer;font:16px/1 'Material Symbols Outlined'">add</button>
              </span>
              <button onClick="{{ p.remove }}" title="Remove" style="width:28px;height:28px;display:grid;place-items:center;background:transparent;border:0;border-radius:6px;color:#98A2B3;cursor:pointer" style-hover="background:#F2F4F7;color:#B42318"><span style="font:18px/1 'Material Symbols Outlined'">close</span></button>
            </div>
          </sc-for>
          <sc-if value="{{ partPicker }}">
            <div style="flex:none;border:1px solid #D0D5DD;border-radius:6px;overflow:hidden">
              <label style="height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #EEF0F3"><span style="font:18px/1 'Material Symbols Outlined';color:#98A2B3">search</span><input value="{{ pq }}" onInput="{{ setPq }}" placeholder="Search spare parts by name or reference…" style="flex:1;border:0;outline:none;font:13px 'IBM Plex Sans',sans-serif" /></label>
              <div style="max-height:180px;overflow:auto">
                <sc-for list="{{ partOpts }}" as="o">
                  <button onClick="{{ o.add }}" style="width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;background:transparent;border:0;text-align:left;cursor:pointer;font:13px 'IBM Plex Sans',sans-serif;color:#1E2430" style-hover="background:#F9FAFB">
                    <span style="flex:1">{{ o.name }} <span style="font:12px 'IBM Plex Mono',monospace;color:#667085">{{ o.ref }}</span></span>
                    <span style="font-size:12px;color:{{ o.stockColor }};font-weight:500">{{ o.stockLabel }}</span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>
          <button onClick="{{ togglePicker }}" style="align-self:flex-start;height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#fff;border:1px dashed #C4CAD4;border-radius:6px;font:500 13px 'IBM Plex Sans',sans-serif;color:#344054;cursor:pointer"><span style="font:18px/1 'Material Symbols Outlined'">add</span>Add part</button>
          <div style="display:flex;align-items:center;margin-top:10px"><span style="font-size:12.5px;font-weight:500;color:#344054">Documents</span></div>
          <sc-for list="{{ docs }}" as="d">
            <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #E4E7EC;border-radius:6px">
              <span style="width:28px;height:28px;border-radius:6px;background:#FDECEC;color:#B42318;display:grid;place-items:center;font:600 9.5px 'IBM Plex Mono',monospace">PDF</span>
              <span style="flex:1;font-weight:500">{{ d.name }}</span>
              <button onClick="{{ d.remove }}" style="width:28px;height:28px;display:grid;place-items:center;background:transparent;border:0;border-radius:6px;color:#98A2B3;cursor:pointer"><span style="font:18px/1 'Material Symbols Outlined'">close</span></button>
            </div>
          </sc-for>
          <button onClick="{{ addDoc }}" style="align-self:flex-start;height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#fff;border:1px dashed #C4CAD4;border-radius:6px;font:500 13px 'IBM Plex Sans',sans-serif;color:#344054;cursor:pointer"><span style="font:18px/1 'Material Symbols Outlined'">attach_file</span>Add document</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid #EEF0F3">
        <button onClick="{{ toggleAnother }}" style="display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:0;font:13px 'IBM Plex Sans',sans-serif;color:#344054;cursor:pointer">
          <span style="width:16px;height:16px;border-radius:4px;border:1.5px solid {{ anotherBorder }};background:{{ anotherBg }};display:grid;place-items:center;color:#fff;font:13px/1 'Material Symbols Outlined'">{{ anotherIcon }}</span>Create another
        </button>
        <sc-if value="{{ hasErrors }}"><span style="margin-left:12px;font-size:12.5px;color:#B42318;display:flex;align-items:center;gap:4px"><span style="font:16px/1 'Material Symbols Outlined'">error</span>Check required fields</span></sc-if>
        <button onClick="{{ closeDrawer }}" style="margin-left:auto;height:34px;padding:0 14px;background:#fff;border:1px solid #D0D5DD;border-radius:6px;font:500 13px 'IBM Plex Sans',sans-serif;color:#1E2430;cursor:pointer">Cancel</button>
        <button onClick="{{ create }}" style="height:34px;padding:0 16px;background:#C00018;border:0;border-radius:6px;font:600 13px 'IBM Plex Sans',sans-serif;color:#fff;cursor:pointer" style-hover="background:#A30014">Create work order</button>
      </div>
    </aside>
  </sc-if>

  <sc-if value="{{ toast }}">
    <div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1E2430;color:#fff;border-radius:8px;font:500 13px 'IBM Plex Sans',sans-serif;box-shadow:0 8px 24px rgba(16,24,40,.24)"><span style="font:18px/1 'Material Symbols Outlined';color:#4ADE9B">check_circle</span>{{ toast }}<a href="Work Orders.dc.html" style="color:#FFB3BC;font-weight:600;margin-left:6px">View</a></div>
  </sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;onCreated&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(row: object) => void&quot;}}">
const PDOT = { Critical: '#C00018', High: '#E0591B', Medium: '#E3A008', Low: '#98A2B3', '': '#D0D5DD' };
const PEOPLE = { 'Pierre Leroy': ['PL', '#E8EEF9', '#2456B8'], 'Sophie Martin': ['SM', '#F3EEFC', '#6941C6'], 'Marc Dupont': ['MD', '#E6F4EE', '#0B6B4A'], 'Julie Martin': ['JM', '#FEF3E2', '#B54708'], 'Sofia Benali': ['SB', '#FDECEC', '#B42318'] };
const ASSETS = [['FT2-FR-001', 'Tempering Furnace 2', 'Tempering Line'], ['FT1-FR-001', 'Tempering Furnace 1', 'Tempering Line'], ['CV-L3', 'Conveyor Line 3', 'Float Line'], ['CV-L2', 'Conveyor Line 2', 'Float Line'], ['P-101', 'Pump P-101', 'Tempering Line'], ['V-12', 'Fan V-12', 'Float Line'], ['C-01', 'Compressor C-01', 'Utilities'], ['RP-01', 'Palletizing Robot 1', 'Packaging Line'], ['PH-030', 'Hydraulic Press PH-030', 'Workshop'], ['S-01', 'Dryer S-01', 'Utilities']];
const PARTS = [['BRG-6205', 'Ball bearing 6205-2RS', 42, 10], ['BLT-BPU280', 'Drive belt BPU280', 2, 5], ['FLT-HX10', 'Hydraulic filter HX-10', 0, 4], ['SEN-PT100', 'Temperature probe PT100', 6, 3], ['SEAL-M45', 'Mechanical seal 45 mm', 3, 2], ['GRS-LT2', 'Lithium grease LT2 400 g', 18, 6], ['ENC-500', 'Incremental encoder 500 ppr', 1, 2], ['VFD-ATV320', 'Variable speed drive ATV320', 0, 1]];
const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = d => { if (!d) return '—'; const [ymd, t] = d.split('T'); const [, m, dd] = ymd.split('-'); return `${M[+m - 1]} ${+dd}${t ? ', ' + t : ''}`; };
const TYPES = [['Corrective', 'build'], ['Preventive', 'event_repeat'], ['Predictive', 'insights'], ['Inspection', 'visibility']];
const blank = () => ({ asset: '', type: 'Corrective', prio: '', who: '', req: '2026-09-29', due: '', title: '', desc: '', cat: '', stop: false, parts: [], docs: [] });
const stock = (q0, min) => q0 === 0 ? ['Out of stock', '#B42318'] : q0 < min ? [`Low · ${q0} in stock`, '#B54708'] : [`${q0} in stock`, '#0B6B4A'];
class Component extends DCLogic {
  state = { drawer: false, form: blank(), prefilled: false, errors: {}, another: false, picker: false, pq: '', toast: null };
  componentDidMount() {
    this._open = e => { const d = { ...((e && e.detail) || {}) }; if (d.asset) { const m = ASSETS.find(a => a[0] === d.asset || a[1] === d.asset); d.asset = m ? m[0] : ''; } this.setState({ drawer: true, form: { ...blank(), ...d }, prefilled: !!d.asset, errors: {}, picker: false }); };
    this._key = e => { if (e.key === 'Escape' && this.state.drawer) this.setState({ drawer: false }); };
    window.addEventListener('cmms-create-wo', this._open);
    this._click = e => { const a = e.target.closest && e.target.closest('a[href*="Work Orders.dc.html?new=1"]'); if (!a) return; e.preventDefault(); e.stopPropagation(); const q = new URLSearchParams(a.getAttribute('href').split('?')[1]); this._open({ detail: { asset: q.get('asset') || '' } }); };
    document.addEventListener('click', this._click, true); window.addEventListener('keydown', this._key);
    window.CMMSCreateWO = d => window.dispatchEvent(new CustomEvent('cmms-create-wo', { detail: d || {} }));
  }
  componentWillUnmount() { document.removeEventListener('click', this._click, true); window.removeEventListener('cmms-create-wo', this._open); window.removeEventListener('keydown', this._key); }
  flash(t) { this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 3600); }
  setF(k, v) { this.setState(s => ({ form: { ...s.form, [k]: v }, errors: { ...s.errors, [k]: 0 } })); }
  create() {
    const f = this.state.form, errors = {};
    ['asset', 'prio', 'who', 'req', 'title', 'desc'].forEach(k => { if (!f[k]) errors[k] = 1; });
    if (f.due && f.due.slice(0, 10) < f.req) errors.due = 1;
    if (Object.keys(errors).length) return this.setState({ errors });
    const row = { title: f.title, type: f.type, asset: f.asset, assetName: (ASSETS.find(a => a[0] === f.asset) || [0, f.asset])[1], status: f.due ? 'Scheduled' : 'Requested', prio: f.prio, who: f.who, date: f.due, stop: f.stop };
    window.dispatchEvent(new CustomEvent('cmms-wo-created', { detail: row }));
    if (this.props.onCreated) this.props.onCreated(row);
    this.setState(s => ({ drawer: s.another, form: s.another ? { ...blank(), asset: f.asset } : s.form, errors: {}, picker: false }));
    this.flash(`"${f.title}" created${f.due ? ' · ' + fmtDate(f.due) : ' · not scheduled'}`);
  }
  renderVals() {
    const s = this.state, f = s.form, pq = s.pq.toLowerCase();
    const assetOf = c => ASSETS.find(a => a[0] === c) || [c, c, ''];
    const E = k => s.errors[k] ? '#F04438' : '#D0D5DD';
    return {
      closeDrawer: () => this.setState({ drawer: false, picker: false }),
      drawerOpen: s.drawer, drawerSub: s.prefilled ? `For ${assetOf(f.asset)[1]}` : 'Fields marked * are required', prefilled: s.prefilled && !!f.asset,
      f, err: { asset: E('asset'), prio: E('prio'), who: E('who'), req: E('req'), due: E('due'), title: E('title'), desc: E('desc') }, dateErr: !!s.errors.due,
      on: Object.fromEntries(['asset', 'prio', 'who', 'req', 'due', 'title', 'desc', 'cat'].map(k => [k, e => this.setF(k, e.target.value)])),
      assetOpts: ASSETS.map(([code, name, line]) => ({ code, label: `${name} · ${code} · ${line}` })),
      types: TYPES.map(([t, icon]) => ({ label: t, icon, bg: f.type === t ? '#FBF1F2' : '#fff', border: f.type === t ? '#C00018' : '#D0D5DD', color: f.type === t ? '#A30014' : '#344054', font: f.type === t ? "600 13px 'IBM Plex Sans',sans-serif" : "500 13px 'IBM Plex Sans',sans-serif", select: () => this.setF('type', t) })),
      prioDot: PDOT[f.prio || ''], descCount: (f.desc || '').length,
      toggleStop: () => this.setF('stop', !f.stop), stopTrack: f.stop ? '#C00018' : '#D0D5DD', stopKnob: f.stop ? '18px' : '2px', stopLabel: f.stop ? 'Yes — production is stopped' : 'No',
      parts: f.parts.map(p => { const [sl, sc] = stock(p.stock, p.min); return { ...p, stockLabel: sl, stockColor: sc,
        inc: () => this.setF('parts', f.parts.map(x => x.ref === p.ref ? { ...x, qty: x.qty + 1 } : x)),
        dec: () => this.setF('parts', f.parts.map(x => x.ref === p.ref ? { ...x, qty: Math.max(1, x.qty - 1) } : x)),
        remove: () => this.setF('parts', f.parts.filter(x => x.ref !== p.ref)) }; }),
      partPicker: s.picker, togglePicker: () => this.setState({ picker: !s.picker, pq: '' }), pq: s.pq, setPq: e => this.setState({ pq: e.target.value }),
      partOpts: PARTS.filter(([ref, name]) => !f.parts.some(p => p.ref === ref) && (!pq || (ref + name).toLowerCase().includes(pq))).map(([ref, name, st, min]) => { const [sl, sc] = stock(st, min); return { ref, name, stockLabel: sl, stockColor: sc,
        add: () => { this.setF('parts', [...f.parts, { ref, name, stock: st, min, qty: 1 }]); this.setState({ picker: false }); } }; }),
      docs: f.docs.map((name, i) => ({ name, remove: () => this.setF('docs', f.docs.filter((_, j) => j !== i)) })),
      addDoc: () => this.setF('docs', [...f.docs, ['Repair procedure.pdf', 'Electrical drawing.pdf', 'Manufacturer manual.pdf'][f.docs.length % 3]]),
      toggleAnother: () => this.setState({ another: !s.another }), anotherBorder: s.another ? '#C00018' : '#C4CAD4', anotherBg: s.another ? '#C00018' : '#fff', anotherIcon: s.another ? 'check' : '',
      hasErrors: Object.values(s.errors).some(Boolean), create: () => this.create(), toast: s.toast,
    };
  }
}
</script>
